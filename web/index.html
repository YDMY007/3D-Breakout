    <style>
      /* ===== 3D-Breakout 瘦身：隐藏 MSI 营销残留 ===== */

      .dzk-level-diff-icon{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;background:rgba(255,255,255,.06);font-size:12px;line-height:1;letter-spacing:0}

      .dzk-level-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
      .dzk-level-btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;min-height:72px;padding:10px 8px;border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.14);color:#fff;cursor:pointer;transition:transform .15s,background .15s,border-color .15s,box-shadow .15s;overflow:hidden}

      .dzk-level-name{font-size:15px;font-weight:700;letter-spacing:.04em;line-height:1.2;text-align:center}

      .dzk-level-card .dzk-close{position:absolute;top:12px;right:16px;font-size:22px;line-height:1;color:#fff;opacity:.6;cursor:pointer;background:none;border:none;z-index:2}
      .dzk-level-card .dzk-close:hover{opacity:1}
      /* 上次游玩标记（更醒目的徽章） */

      /* === 选关面板布局（2026-08-24 改版：单栏，无尽卡缩小一半，设置折叠） === */
      .dzk-level-body{display:block}
      /* 顶部行：无尽模式入口 + 关卡/游玩数据卡 */
      .dzk-level-top{display:flex;gap:14px;align-items:stretch;margin-bottom:14px}
      /* 无尽模式卡片 */
      .dzk-endless-card{display:flex;align-items:center;justify-content:space-between;gap:14px;flex:1 1 0;min-width:0;padding:9px 14px;border-radius:12px;background:linear-gradient(135deg,rgba(81,67,255,.32),rgba(250,0,255,.22));border:1px solid rgba(250,0,255,.55);box-shadow:0 0 22px rgba(81,67,255,.28) inset,0 4px 18px rgba(250,0,255,.18);position:relative;overflow:hidden}

      .dzk-endless-btn{flex-shrink:0;padding:7px 16px;border-radius:10px;font-size:13px;font-weight:800;letter-spacing:.05em;color:#fff;background:linear-gradient(135deg,#5143FF,#FA00FF);border:none;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 18px rgba(250,0,255,.5)}

      /* 数据卡：关卡数据 + 游玩数据 */

      .dzk-stat-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);font-size:10px;font-weight:700;white-space:nowrap}

      .dzk-tabs{display:flex;gap:6px;margin:14px 0 16px;padding:5px;border-radius:14px;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.09)}

      /* === 设置页：左「游戏参数」/ 右「小球效果」双栏 === */

      /* 无尽公平模式：提示条 + 设置锁定 */
      .dzk-fair-notice{margin-bottom:12px;padding:10px 14px;border-radius:10px;font-size:12px;font-weight:600;letter-spacing:.04em;color:#FFE27A;background:rgba(255,200,60,.1);border:1px solid rgba(255,200,60,.45);text-align:center}

      /* 参数说明（左栏底部，平衡双栏高度） */
      .dzk-param-tips{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:7px}

      .dzk-ultimate-row{display:flex;align-items:center;gap:10px;padding:9px 10px;margin:2px 0 10px;border-radius:10px;background:linear-gradient(135deg,rgba(250,0,255,.12),rgba(255,60,90,.08));border:1px solid rgba(255,80,110,.4)}

      .dzk-opt-row input[type=range],.dzk-bonus-weight{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:6px;border-radius:999px;outline:none;cursor:pointer;border:none;background:linear-gradient(90deg,var(--rc,#FFC83C) 0%,var(--rc,#FFC83C) var(--pct,50%),rgba(255,255,255,.14) var(--pct,50%),rgba(255,255,255,.14) 100%)}

      .dzk-opt-row input[type=range]:hover::-webkit-slider-thumb,.dzk-bonus-weight:hover::-webkit-slider-thumb{transform:scale(1.18)}

      .dzk-bonus-list{display:flex;flex-direction:column;gap:6px}

      @media(max-width:880px){.dzk-level-card{max-width:94vw;max-height:92vh}.dzk-level-top{flex-direction:column}.dzk-endless-card{flex:none;width:auto}.dzk-settings-grid{grid-template-columns:1fr}}
      /* Home 键按钮（替换左上角 MSI logo） */
      .dzk-home-btn{position:relative;display:flex;align-items:center;justify-content:center;width:var(--logo-size,60px);height:calc(var(--logo-size,60px) * .6);color:#fff;background:transparent;border:none;cursor:pointer;opacity:.85;transition:opacity .2s,transform .2s;pointer-events:all}

      /* Home 主菜单弹窗 */
      .dzk-home-modal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:2147483644;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s ease,visibility .35s ease}

      .dzk-home-card .dzk-close{position:absolute;top:10px;right:14px;font-size:20px;line-height:1;color:#fff;opacity:.6;cursor:pointer;background:none;border:none}

      /* ===== 最终成绩弹窗美化 ===== */

      .page.page-results{display:flex !important;align-items:center !important;justify-content:center !important}
      .popin{position:relative;width:380px;max-width:90vw;padding:36px 32px 32px !important;border-radius:20px !important;background:linear-gradient(160deg,rgba(28,12,48,.97),rgba(12,8,28,.97)) !important;border:1px solid rgba(255,120,200,.5) !important;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05) inset,0 0 80px rgba(250,0,255,.25) !important;color:#fff;font-family:"Exo2",Arial,Helvetica,sans-serif;text-align:center;overflow:hidden}
      .popin::before{content:"";position:absolute;top:-1px;left:24px;right:24px;height:2px;background:linear-gradient(90deg,transparent,#fa00ff,#00dcff,transparent);opacity:.85;pointer-events:none}
      .popin__header{margin-bottom:0 !important;padding:0 !important;width:100% !important;display:flex !important;flex-direction:column !important;align-items:center !important;justify-content:center !important}
      .popin__results-text{display:flex !important;flex-direction:column !important;align-items:center !important;justify-content:center !important;gap:6px;width:100% !important;padding:0 !important;margin:0 !important}
      .popin .results-title{font-size:13px !important;letter-spacing:.3em;font-weight:500;opacity:.65;text-transform:uppercase;margin:0 0 4px !important;padding:0 !important;color:#cdb4ff !important;text-align:center !important;align-self:center !important;font-family:"Exo2",Arial,Helvetica,sans-serif}
      .popin__score{position:relative !important;display:flex !important;flex-direction:row !important;align-items:center !important;justify-content:center !important;gap:6px;margin:8px 0 4px !important;padding:0 !important;background:transparent !important;text-shadow:none !important;font-family:"Exo2",Arial,Helvetica,sans-serif;align-self:center !important;width:auto !important}
      /* 彩虹渐变文字：红橙黄绿青蓝紫，无背景辉光 */
      .popin__score span,.popin .score-value{background:linear-gradient(90deg,#ff4d4d 0%,#ff9f43 18%,#ffd93d 34%,#6bff6b 50%,#37d5ff 68%,#7a6bff 84%,#ff4dd2 100%) !important;-webkit-background-clip:text !important;background-clip:text !important;-webkit-text-fill-color:transparent !important;color:transparent !important;text-shadow:none !important;filter:none !important;font-size:72px !important;font-weight:800 !important;line-height:1 !important;letter-spacing:-.02em;display:inline-block !important;font-family:"Exo2",Arial,Helvetica,sans-serif}
      .popin__content{display:flex !important;flex-direction:column !important;align-items:center !important;justify-content:center !important;padding:0 !important;background:transparent !important;width:100% !important}
      .popin__content::after{display:none !important}
      .popin__buttons{display:flex !important;align-items:center !important;justify-content:center !important;width:100% !important;margin-top:24px !important;padding:0 !important}
      .popin__buttons{display:flex;gap:12px !important;justify-content:center;width:100% !important;margin-top:24px !important;padding:0 !important}
      .popin .cta-retry{position:relative !important;display:flex !important;align-items:center !important;justify-content:center !important;gap:8px;min-width:0 !important;height:50px !important;padding:0 16px !important;border-radius:999px !important;background:linear-gradient(135deg,#fa00ff 0%,#5143ff 100%) !important;border:none !important;color:#fff !important;font-size:15px !important;font-weight:700 !important;letter-spacing:.05em !important;text-transform:uppercase !important;white-space:nowrap !important;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 8px 24px rgba(250,0,255,.4),0 0 0 1px rgba(255,255,255,.15) inset}
      .popin .cta-retry:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(250,0,255,.6),0 0 0 1px rgba(255,255,255,.2) inset}
      .popin .cta-retry svg{width:18px !important;height:18px !important}
      .popin .cta-retry .text{font-size:15px !important;font-weight:700 !important;letter-spacing:.15em !important}
      /* 结算页按钮：再试一次 + 选择关卡 并排各占一半 */
      .popin__buttons{gap:12px !important}
      .popin .popin__buttons .cta-retry,
      .popin .popin__buttons .cta-level-select{flex:0 0 calc(50% - 6px) !important;width:calc(50% - 6px) !important;min-width:0 !important;max-width:none !important;margin:0 !important}
      /* retry 内部 svg+text 自然高度会撑高按钮，强制 line-height:1 保持 50px 高度 */
      .popin .popin__buttons .cta-retry{line-height:1 !important;overflow:hidden !important}
      .popin .popin__buttons .cta-retry .text{line-height:1 !important;display:inline-flex !important;align-items:center !important}
      .popin .popin__buttons .cta-retry svg{flex:0 0 auto !important}
      .popin .cta-level-select{position:relative !important;display:flex !important;align-items:center !important;justify-content:center !important;height:50px !important;padding:0 12px !important;border-radius:999px !important;background:linear-gradient(135deg,#00dcff 0%,#5143ff 100%) !important;border:none !important;color:#fff !important;font-size:15px !important;font-weight:700 !important;letter-spacing:.05em !important;text-transform:uppercase !important;white-space:nowrap !important;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 8px 24px rgba(0,220,255,.35),0 0 0 1px rgba(255,255,255,.15) inset}
      .popin .cta-level-select:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,220,255,.55),0 0 0 1px rgba(255,255,255,.2) inset}
      .popin__content{padding:0 !important;background:transparent !important}
      .popin__content::after{display:none !important}
      /* ===== 顶部两列竖版面板：左无尽 右排行榜，数据卡横条在下 ===== */
      .dzk-level-top{display:flex;gap:14px;align-items:stretch;margin-bottom:10px;height:164px}
      .dzk-level-top > *{flex:0 0 calc((100% - 28px) / 3);min-width:0}
      .dzk-level-top .dzk-endless-card{flex-direction:column;align-items:stretch;justify-content:flex-start;gap:3px;padding:10px 14px 12px}
      .dzk-level-top .dzk-endless-btn{margin-top:auto;width:100%;text-align:center}
      .dzk-endless-floor{font-size:11px;opacity:.92}
      .dzk-level-top .dzk-endless-desc{white-space:normal;overflow:visible;text-overflow:clip;font-size:9px;line-height:1.55;opacity:.8;margin-top:4px}
      .dzk-top-left .dzk-endless-desc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .dzk-lb-card{flex:1 1 0;min-height:0;position:relative;display:flex;flex-direction:column;gap:5px;padding:8px 12px 9px;border-radius:12px;background:rgba(0,0,0,.26);border:1px solid rgba(0,220,255,.3);box-shadow:0 0 18px rgba(0,220,255,.12) inset}
      .dzk-lb-head{display:flex;align-items:center;gap:8px;flex-shrink:0}
      .dzk-lb-title{font-size:11px;font-weight:800;letter-spacing:.06em;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .dzk-lb-spacer{flex:1}
      .dzk-lb-mine{font-size:10px;color:#51AFFF;font-weight:800;white-space:nowrap}
      .dzk-lb-gear{flex-shrink:0;width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;font-size:11px;line-height:1;cursor:pointer;padding:0}
      .dzk-lb-gear:hover{background:rgba(255,255,255,.16)}
      .dzk-lb-list{flex:1 1 0;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin;scrollbar-color:rgba(0,220,255,.4) transparent}
      .dzk-lb-row{display:flex;align-items:center;gap:7px;font-size:11px;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.045);flex-shrink:0}
      .dzk-lb-row.me{background:rgba(81,175,255,.16);outline:1px solid rgba(81,175,255,.4)}
      .dzk-lb-rank{width:20px;font-weight:800;color:#FFD75E;text-align:center;flex-shrink:0}
      .dzk-lb-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.9}
      .dzk-lb-score{font-weight:800;color:#FA00FF;white-space:nowrap;font-variant-numeric:tabular-nums}
      .dzk-lb-floor{flex-shrink:0;font-weight:800;color:#8FD8FF;white-space:nowrap;font-variant-numeric:tabular-nums}
      .dzk-lb-date{flex-shrink:0;font-size:9px;opacity:.5;white-space:nowrap;font-variant-numeric:tabular-nums}
      .dzk-lb-empty{font-size:10px;opacity:.5;text-align:center;padding:7px 0}
      .dzk-lb-settings{position:absolute;left:10px;right:10px;bottom:10px;z-index:6;display:flex;flex-direction:column;gap:5px;padding:8px 10px;border-radius:8px;background:rgba(8,8,18,.96);border:1px solid rgba(0,220,255,.45);box-shadow:0 10px 34px rgba(0,0,0,.6)}
      .dzk-lb-settings label{font-size:9px;opacity:.7;display:flex;flex-direction:column;gap:2px}
      .dzk-lb-settings input{padding:4px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.45);color:#fff;font-size:11px;outline:none}
      .dzk-lb-settings input:focus{border-color:rgba(0,220,255,.6)}
      .dzk-lb-hint{font-size:9px;opacity:.5;line-height:1.5}
      .dzk-lb-privacy-toggle{color:#51AFFF;cursor:pointer;text-decoration:underline}
      .dzk-lb-privacy{max-height:104px;overflow-y:auto;font-size:9px;line-height:1.6;opacity:.72;padding:6px 8px;border-radius:6px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12);scrollbar-width:thin}
      .dzk-lb-actions{display:flex;gap:8px}
      .dzk-lb-actions button{flex:1;padding:5px 0;border-radius:6px;border:none;font-size:11px;font-weight:700;cursor:pointer;color:#fff}
      .dzk-lb-save{background:linear-gradient(135deg,#00dcff,#5143ff)}
      .dzk-lb-close{background:rgba(255,255,255,.12)}
      .dzk-level-top .dzk-stats-card{gap:6px;padding:9px 12px}
      /* ===== 移动端适配（≤880px：三列面板纵向堆叠、参数行收窄，修复窄屏溢出/重叠） ===== */
      @media(max-width:880px){
        .dzk-level-card{max-width:94vw;max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px);padding:16px 14px 14px;border-radius:14px}
        .dzk-level-card h2{font-size:20px}
        .dzk-level-card .dzk-close{top:8px;right:10px;font-size:20px}
        /* 顶部三卡：竖向堆叠，高度自适应（覆盖三列定高布局） */
        .dzk-level-top{flex-direction:column;height:auto;gap:10px;margin-bottom:12px}
        .dzk-level-top > *{flex:0 0 auto;width:auto}
        /* 无尽卡恢复横排：标题+层数居左，按钮居右；窄屏收起 4 行说明 */
        .dzk-level-top .dzk-endless-card{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px}
        .dzk-level-top .dzk-endless-desc{display:none}
        .dzk-level-top .dzk-endless-floor{margin-top:0;font-size:11px}
        .dzk-level-top .dzk-endless-btn{margin-top:0;width:auto;padding:8px 18px}
        /* 排行榜卡：列表给固定可视高度 */
        .dzk-lb-card{min-height:158px}
        .dzk-lb-row{font-size:10px}
        /* 数据卡两个 section 正常纵排 */
        .dzk-level-top .dzk-stats-card{gap:8px;padding:10px 12px}
        /* 关卡按钮固定 2 列 */
        .dzk-level-list{grid-template-columns:repeat(2,1fr)}
        .dzk-level-btn{min-height:64px;padding:8px 6px}
        .dzk-level-name{font-size:14px}
        /* 设置页单列 + 参数行收窄 */
        .dzk-settings-grid{grid-template-columns:1fr}
        .dzk-settings-col{padding:12px}
        .dzk-settings-hint{max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .dzk-opt-row{gap:8px;margin:9px 0}
        .dzk-opt-row label{flex:0 0 62px;font-size:11px}
        .dzk-opt-val{flex:0 0 44px;font-size:11px}
        .dzk-bonus-name{flex:0 0 62px;font-size:11px}
        .dzk-bonus-weight-val{flex:0 0 40px}
        .dzk-param-tip{font-size:10px}
        .dzk-tabs{margin:10px 0 12px}
        .dzk-tab{padding:8px 0;font-size:12px}
      }
      /* 手机端游戏内：主页/刷新按钮下移到顶部生命值/分数 HUD 条(约57px高)以下，避免重叠。
         dzk-in-game 由 records_v17 的轮询根据 .page.page-game 是否存在打/摘 */
      @media(max-width:767px){
        html.dzk-in-game .dzk-home-btn{transform:translateY(52px)}
      }
      /* 手机端结算卡：取消原版 ≤699px 的全屏拉伸(min-height:inner-height)，
         恢复紧凑居中卡片，避免"标题分数悬在半空、按钮沉底"的稀疏布局 */
      @media(max-width:699px){
        .page.page-results{position:fixed !important;top:0;right:0;bottom:0;left:0;min-height:0;display:flex !important;align-items:center !important;justify-content:center !important;padding:0 12px}
        .popin{min-height:0 !important;max-height:92vh;overflow-y:auto}
      }
      /* 手机端弹窗触摸滚动:引擎全局 touchmove passive:false 注册会吞掉弹窗滚动,
         data-bypass-touch 豁免 preventDefault 后,再显式允许纵向手势 */
      .dzk-level-card, .dzk-records-card{touch-action:pan-y}
      .dzk-level-card input[type=range], .dzk-settings-col input[type=range]{touch-action:none}
      /* 本地存储不可用告警条 + 设置页存储状态行 */
      .dzk-storage-warn{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:12px;max-width:92vw;padding:10px 16px;border-radius:12px;background:rgba(40,10,30,.94);border:1px solid rgba(255,80,110,.55);box-shadow:0 8px 30px rgba(0,0,0,.5);color:#FFD9E2;font-family:"Exo2",Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5}
      .dzk-storage-warn b{color:#FF8AA6}
      .dzk-storage-warn button{flex-shrink:0;width:22px;height:22px;border:none;border-radius:6px;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
      .dzk-storage-line{margin:10px 0 0;font-size:11px;opacity:.6;text-align:center}
      .dzk-storage-line span{opacity:.75}
